[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dispersion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==16.1.0",
    "scipy==1.13.1",
    "matplotlib==3.9.0",
    "pyyaml==6.0.1",
    "pytest==8.2.2",
    "numba==0.60.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
